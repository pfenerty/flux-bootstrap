apiVersion: v2
name: talos-upgrades
description: >-
  The TalosUpgrade and KubernetesUpgrade resources tuppr reconciles. A chart
  rather than plain manifests because both carry a version that lives in
  Terraform's cluster-versions ConfigMap, and a HelmRelease valuesFrom
  targetPath is how a value gets from there into a specific field. tuppr's own
  chart templates only the controller, so there is no release of it to hang
  these off instead.
type: application
# Static. The HelmRelease that installs this uses
# `reconcileStrategy: Revision`, so releases follow the git revision rather
# than this number, and there is no registry for it to be meaningful in.
version: 1.0.0

# Supplied by the HelmRelease from Terraform's `cluster-versions` ConfigMap,
# which holds the same two values that select the node AMI and render the
# machine config. That is the point of routing them through Terraform: the
# version a new node boots and the version the fleet is converged to cannot
# disagree.
#
# No defaults. A wrong value here is an upgrade of every node in the cluster,
# so the templates fail to render rather than guess - see the `required` calls
# in templates/.
#
# Both carry a leading `v`; both CRDs validate against
# `^v[0-9]+\.[0-9]+\.[0-9]+`. Terraform normalises `kubernetes_version`, which
# has no `v` on its side, before writing the ConfigMap.
talosVersion: ""
kubernetesVersion: ""

talosUpgrade:
  # Pull each node's installer image before the first node is cordoned, so an
  # unreachable registry or a bad tag parks the run before anything is
  # disrupted rather than halfway through the fleet.
  prePull: true

  policy:
    # Drain the node and wait for its CSI volumes to detach before the reboot.
    # On by default here because this cluster runs the EBS CSI driver: a fast
    # reboot that orphans a mount produces a Multi-Attach error on the volume,
    # and the pod that owned it does not come back until the attachment times
    # out. No-op on a single-node cluster.
    waitForVolumeDetach: true

    # Required anti-affinity between the upgrade Job and the node it is
    # upgrading. tuppr downgrades this to a preference by itself on a
    # single-node cluster, where the Job would otherwise be unschedulable.
    placement: hard

    # The chart default is debug: true, which is a reasonable default for a
    # controller you are learning and a noisy one for a cluster you are not.
    debug: false

  # Which nodes the run covers. Empty means every node the cluster has,
  # including the ones Karpenter launched - which is usually not what you
  # want, because those are replaced on drift rather than upgraded. Set a
  # selector once there is a label that tells the two apart.
  nodeSelector: {}

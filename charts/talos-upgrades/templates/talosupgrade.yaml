apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    version: {{ required "talosVersion is required: it comes from the cluster-versions ConfigMap Terraform writes into flux-system" .Values.talosVersion | quote }}
    prePull: {{ .Values.talosUpgrade.prePull }}
  policy:
    {{- toYaml .Values.talosUpgrade.policy | nindent 4 }}
  {{- with .Values.talosUpgrade.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}

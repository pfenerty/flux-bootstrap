apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.name }}
spec:
  # The AMI is a Talos image, which Karpenter has no template for: it cannot
  # generate the user data, read the kubelet's configuration or reason about
  # the image's bootstrap. `Custom` is what says so.
  amiFamily: Custom
  amiSelectorTerms:
    - id: {{ required "amiID is required: it comes from the karpenter-config secret written by Terraform" .Values.amiID | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "discoveryTag is required: it comes from the karpenter-config secret written by Terraform" .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  instanceProfile: {{ required "instanceProfile is required: it comes from the karpenter-config secret written by Terraform" .Values.instanceProfile | quote }}
  associatePublicIPAddress: {{ .Values.nodeClass.associatePublicIPAddress }}
  metadataOptions:
    {{- toYaml .Values.nodeClass.metadataOptions | nindent 4 }}
  blockDeviceMappings:
    - deviceName: {{ .Values.nodeClass.rootDeviceName | quote }}
      rootVolume: true
      ebs:
        volumeSize: {{ .Values.nodeClass.rootVolume.size | quote }}
        volumeType: {{ .Values.nodeClass.rootVolume.type | quote }}
        encrypted: {{ .Values.nodeClass.rootVolume.encrypted }}
        deleteOnTermination: {{ .Values.nodeClass.rootVolume.deleteOnTermination }}
  {{- with .Values.nodeClass.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  userData: |
    {{- required "userData is required: it is the Talos machine config from the karpenter-config secret" .Values.userData | nindent 4 }}

# The ServiceMonitor, PodMonitor and PrometheusRule CRDs, installed with the
# infrastructure rather than with the observability layer.
#
# They are here because Cilium needs them: its HelmRelease turns on
# ServiceMonitors for the agent, the operator and Hubble, and Helm fails the
# release outright if the CRD is missing. Cilium is infrastructure and the
# Prometheus stack is not, so the CRDs come first and the stack that reads
# them can be installed, removed or replaced without taking Cilium with it.
#
# The stack's own copies are disabled (`crds.enabled: false`) so that only
# this release owns them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community

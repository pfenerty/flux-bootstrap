# Installed for Hubble's certificates, and available for anything else that
# needs an issuer. Cilium's Hubble mTLS is generated by cert-manager from the
# trust anchor Terraform puts in `kube-system/hubble-trust-anchor`, so
# cert-manager has to be running before the Cilium HelmRelease upgrades the
# bootstrap install.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
  targetNamespace: cert-manager
  values:
    # Templated by the chart rather than installed from its crds/ directory,
    # which is why Flux's own `install.crds` policy does not appear here.
    # `keep` leaves the CRDs - and every Certificate and Issuer in the
    # cluster - alone if the release is ever uninstalled.
    crds:
      enabled: true
      keep: true

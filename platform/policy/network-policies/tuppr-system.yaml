apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tuppr-system
spec:
  description: >-
    Default-deny on ingress for the tuppr-system namespace. Egress is not restricted.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # Same namespace. A namespaced policy's empty endpoint selector does not
    # reach past its own namespace, which is what makes this mean that.
    - fromEndpoints:
        - {}
    # The API server calling a webhook, the kubelet running a probe, port
    # forwarding, and Cilium's own health checks. tuppr's validating webhook
    # is what rejects a second TalosUpgrade overlapping the first, so this is
    # load-bearing rather than incidental.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
        - health
    # Prometheus scraping.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability

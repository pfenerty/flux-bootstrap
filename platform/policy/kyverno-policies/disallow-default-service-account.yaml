# V-242381. A workload running as its namespace's `default` service account
# shares an identity with everything else that did not choose one, so RBAC
# cannot tell them apart and a grant to one is a grant to all.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-service-account
  annotations:
    policies.kyverno.io/title: Disallow the default service account
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, ServiceAccount
spec:
  background: true
  rules:
    - name: unique-service-account
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
      validate:
        failureAction: Audit
        message: >-
          Pods must run as a service account of their own, not `default`.
        pattern:
          spec:
            =(serviceAccountName): "!default"

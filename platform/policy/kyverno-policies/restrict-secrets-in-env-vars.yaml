# V-242415. A secret in an environment variable is readable from anything that
# can describe the pod, ends up in crash dumps and process listings, and is
# copied into any log that prints the environment. A mounted secret is not.
#
# This checks `env[].valueFrom.secretKeyRef`, which is the form worth
# catching. `envFrom.secretRef` pulls a whole secret in at once and is not
# expressible as a pattern here; it is rare, and the policy report will not
# show it.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-secrets-in-env-vars
  annotations:
    policies.kyverno.io/title: Secrets are mounted, not passed in the environment
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Secret
spec:
  background: true
  rules:
    - name: secrets-not-from-env
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
      validate:
        failureAction: Audit
        message: >-
          Mount secrets as files rather than reading them into environment
          variables.
        pattern:
          spec:
            =(initContainers):
              - =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"
            containers:
              - =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"

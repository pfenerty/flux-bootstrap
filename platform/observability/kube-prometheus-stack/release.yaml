# Prometheus, Alertmanager, Grafana and the exporters.
#
# The CRDs are installed with the infrastructure, by the
# prometheus-operator-crds release, because Cilium declares ServiceMonitors
# and would fail to install without them. Both switches below keep this
# release from installing a second copy: `crds.enabled` covers the chart's
# templated copies and Flux's `install.crds: Skip` covers the crds/
# directory.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.4.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: observability
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    crds:
      enabled: false
    # Without this the generated names are the release name twice over.
    cleanPrometheusOperatorObjectNames: true
    fullnameOverride: kps

    prometheus:
      prometheusSpec:
        # Watch every namespace, and every ServiceMonitor in it, rather than
        # only those carrying this release's labels. Cilium, Karpenter, the
        # EBS driver and the CSR approver all declare ServiceMonitors from
        # their own charts and none of them know this release's name.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 15d
        retentionSize: 40GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ebs-sc
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ebs-sc
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    grafana:
      persistence:
        enabled: true
        storageClassName: ebs-sc
        size: 10Gi
      # Cilium and Hubble ship dashboards as ConfigMaps labelled for this
      # sidecar to pick up; it is on by default and searches every namespace.
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.observability.svc.cluster.local:3100
          isDefault: false
          jsonData: {}

    # Nothing on a Talos control plane listens on the addresses these
    # exporters scrape: kube-proxy is disabled entirely, and etcd, the
    # scheduler and the controller manager bind to localhost. Leaving them
    # enabled produces permanently failing targets and alerts about them.
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
